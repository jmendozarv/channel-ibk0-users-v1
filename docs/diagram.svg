<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <rect x="20" y="40" width="160" height="60" fill="#dfe7ff" stroke="#333"/>
  <text x="100" y="75" font-family="Arial" font-size="12" text-anchor="middle">HTTP Clients</text>

  <rect x="220" y="20" width="160" height="100" fill="#e6ffe6" stroke="#333"/>
  <text x="300" y="55" font-family="Arial" font-size="12" text-anchor="middle">Controllers (WebFlux)</text>

  <rect x="420" y="20" width="160" height="100" fill="#fff2cc" stroke="#333"/>
  <text x="500" y="55" font-family="Arial" font-size="12" text-anchor="middle">Services</text>

  <rect x="620" y="20" width="160" height="100" fill="#ffe6f2" stroke="#333"/>
  <text x="700" y="55" font-family="Arial" font-size="12" text-anchor="middle">Repositories (JPA)</text>

  <rect x="420" y="140" width="160" height="60" fill="#f2f2f2" stroke="#333"/>
  <text x="500" y="175" font-family="Arial" font-size="12" text-anchor="middle">H2 (in-memory)</text>

  <line x1="180" y1="70" x2="220" y2="70" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="380" y1="70" x2="420" y2="70" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="580" y1="70" x2="620" y2="70" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="700" y1="120" x2="700" y2="140" stroke="#333" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>

